<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relative Pitch Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>Relative Pitch Game</h1>
    <p>Select note range:</p>
    <button onclick="startGame(2)">First 2 notes</button>
    <button onclick="startGame(3)">First 3 notes</button>
    <button onclick="startGame(4)">First 4 notes</button>
    <button onclick="startGame(5)">First 5 notes</button>
    <button onclick="startGame(6)">First 6 notes</button>
    <button onclick="startGame(7)">First 7 notes</button>
    <button onclick="startGame(8)">Entire Octave (C4–C5)</button>
  </div>

  <div id="game-screen" class="hidden">
    <div id="controls">
      <button onclick="playReference()">Play Reference (C4)</button>
      <button onclick="playCurrentNote()">Replay</button>
      <div id="toggle-buttons">
        <button onclick="setLabelMode('note')" id="noteBtn" class="active">Notes</button>
        <button onclick="setLabelMode('degree')" id="degreeBtn">Scale Degrees</button>
      </div>
      <button onclick="goBack()" id="back-btn">Back</button>
      <button onclick="resetScore()">Reset Score</button>
    </div>
    <div id="note-buttons"></div>
    <p id="feedback"></p>
    <p id="score">Score: 0/0</p>
    <button id="next-btn" class="disabled" onclick="nextQuestion()" disabled>Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
