<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relative Pitch Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>Relative Pitch Game</h1>
    <p>Select the number of notes to use:</p>
    <div id="mode-buttons">
      <button onclick="startGame(2)">First 2 notes</button>
      <button onclick="startGame(3)">First 3 notes</button>
      <button onclick="startGame(4)">First 4 notes</button>
      <button onclick="startGame(5)">First 5 notes</button>
      <button onclick="startGame(6)">First 6 notes</button>
      <button onclick="startGame(7)">First 7 notes</button>
      <button onclick="startGame(8)">Entire Octave (C4–C5)</button>
    </div>
  </div>

  <div id="game-screen" style="display: none;">
    <h2 id="question">What note is this?</h2>

    <div id="toggle-buttons">
      <button id="noteModeBtn" class="active" onclick="setDisplayMode('note')">Notes</button>
      <button id="degreeModeBtn" onclick="setDisplayMode('degree')">Scale Degrees</button>
    </div>

    <div id="note-buttons"></div>

    <div id="controls">
      <button onclick="playReferenceNote()">Play Reference Note (C)</button>
      <button onclick="playNote()">Replay Note</button>
      <button id="next-button" onclick="nextNote()" disabled>Next</button>
    </div>

    <div id="score">Score: 0 / 0</div>

    <div class="bottom-buttons">
      <button onclick="goBack()">Back</button>
      <button onclick="resetScore()">Reset Score</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
